<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wen sites</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/MKdMnGXJ/design.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'float-1': 'float1 4s ease-in-out infinite',
                        'float-2': 'float2 5.5s ease-in-out infinite',
                        'float-3': 'float3 4.5s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float1: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0)' },
                            '50%': { transform: 'translateY(-8px) rotate(0.5deg)' },
                        },
                        float2: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0)' },
                            '50%': { transform: 'translateY(-12px) rotate(-0.5deg)' },
                        },
                        float3: {
                            '0%, 100%': { transform: 'translateY(0) translateX(0)' },
                            '50%': { transform: 'translateY(-10px) translateX(3px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Fallback image background pattern */
        .pattern-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .pattern-bg {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
        }
        
        /* Smooth transition para flutuação e interações */
        .card-hover-effect {
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300 min-h-screen font-sans antialiased relative overflow-x-hidden">
    <!-- Efeito de iluminação de fundo (Glow) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-brand-500/5 dark:bg-brand-500/10 blur-[120px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-purple-500/5 dark:bg-purple-500/10 blur-[120px]"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SVGs (Ícones) ---
        const Icons = {
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Moon: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
            Sun: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Grid: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Compact: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2zM4 21a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2z" /></svg>,
            Star: ({ filled }) => <svg className={`w-4 h-4 ${filled ? 'text-yellow-400 fill-current drop-shadow-md' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>,
            Fork: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 19v-4a2 2 0 012-2h4a2 2 0 012 2v4m-6-10V5a2 2 0 012-2h0a2 2 0 012 2v4M5 5v4m0 0a2 2 0 002 2h0M19 5v4m0 0a2 2 0 01-2 2h0" /></svg>,
            ExternalLink: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>,
            MoreVertical: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>,
            EyeOff: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>,
            Code: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            Share: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>,
            Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
            Info: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Globe: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>,
            Close: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>,
            Image: ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
            Refresh: ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Upload: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        };

        // --- Utilitários ---
        const languageColors = {
            JavaScript: '#f1e05a', TypeScript: '#3178c6', HTML: '#e34c26', CSS: '#563d7c',
            Python: '#3572A5', Java: '#b07219', 'C++': '#f34b7d', Ruby: '#701516',
            Go: '#00ADD8', Rust: '#dea584', PHP: '#4F5D95', Vue: '#41b883',
            Svelte: '#ff3e00', Dart: '#00B4AB', Swift: '#F05138', Kotlin: '#A97BFF'
        };

        const formatDate = (dateString) => {
            if (!dateString) return "Desconhecido";
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('pt-BR', options);
        };

        const getLanguageColor = (lang) => languageColors[lang] || '#8b949e';

        // Custom Hook para gerenciar localStorage
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error("LocalStorage error:", error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error("LocalStorage error:", error);
                }
            };
            return [storedValue, setValue];
        }

        // --- Componentes ---

        // Skeleton Loader
        const SkeletonCard = ({ viewMode }) => {
            if (viewMode === 'list') {
                return (
                    <div className="flex bg-white/50 dark:bg-gray-800/50 backdrop-blur-md border border-gray-100 dark:border-gray-800/50 rounded-2xl p-4 shadow-sm animate-pulse h-32">
                        <div className="w-32 h-full bg-gray-200 dark:bg-gray-700/50 rounded-xl mr-4"></div>
                        <div className="flex-1 space-y-3 py-1">
                            <div className="h-4 bg-gray-200 dark:bg-gray-700/50 rounded w-3/4"></div>
                            <div className="h-3 bg-gray-200 dark:bg-gray-700/50 rounded w-full"></div>
                            <div className="h-3 bg-gray-200 dark:bg-gray-700/50 rounded w-5/6"></div>
                        </div>
                    </div>
                );
            }
            return (
                <div className="bg-white/50 dark:bg-gray-800/50 backdrop-blur-md border border-gray-100 dark:border-gray-800/50 rounded-2xl overflow-hidden shadow-sm animate-pulse">
                    <div className="w-full aspect-[4/3] bg-gray-200 dark:bg-gray-700/50"></div>
                    <div className="p-4 space-y-3">
                        <div className="h-4 bg-gray-200 dark:bg-gray-700/50 rounded w-3/4"></div>
                        <div className="h-3 bg-gray-200 dark:bg-gray-700/50 rounded w-full"></div>
                        <div className="flex justify-between pt-2">
                            <div className="h-3 bg-gray-200 dark:bg-gray-700/50 rounded w-1/4"></div>
                            <div className="h-3 bg-gray-200 dark:bg-gray-700/50 rounded w-1/4"></div>
                        </div>
                    </div>
                </div>
            );
        };

        // Modal de Detalhes
        const DetailsModal = ({ repo, onClose, imageCacheKey = 0 }) => {
            if (!repo) return null;

            // Cache buster: força atualizar a imagem se houver novos commits no repositório ou manualmente
            const cacheBuster = new Date(repo.updated_at).getTime() + imageCacheKey;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fade-in" onClick={onClose}>
                    <div className="bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto border border-gray-200/50 dark:border-gray-700/50" onClick={e => e.stopPropagation()}>
                        <div className="relative">
                            {/* Header image / screenshot large */}
                            <div className="w-full h-64 bg-gray-100 dark:bg-gray-800 relative pattern-bg">
                                <img 
                                    src={`https://image.thum.io/get/width/1000/crop/1200/zoom/300/noanimate/${repo.pageUrl}?v=${cacheBuster}`}
                                    alt={`Preview de ${repo.name}`}
                                    className="w-full h-full object-cover object-top opacity-90"
                                    onError={(e) => {
                                        e.target.style.display = 'none';
                                        e.target.nextSibling.style.display = 'flex';
                                    }}
                                />
                                <div className="absolute inset-0 hidden flex-col items-center justify-center text-gray-400">
                                    <Icons.Globe />
                                    <span className="mt-2 text-sm">Preview não disponível</span>
                                </div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                                <button onClick={onClose} className="absolute top-4 right-4 p-2 bg-black/20 hover:bg-black/50 text-white rounded-full transition-colors backdrop-blur-md border border-white/10">
                                    <Icons.Close />
                                </button>
                                <div className="absolute bottom-6 left-8 text-white">
                                    <h2 className="text-4xl font-extrabold tracking-tight drop-shadow-md">{repo.name}</h2>
                                    <p className="opacity-90 text-sm mt-1 font-medium">{repo.full_name}</p>
                                </div>
                            </div>

                            <div className="p-6 md:p-8 space-y-6">
                                <div className="flex flex-wrap gap-4 items-center text-sm font-medium">
                                    {repo.language && (
                                        <span className="flex items-center px-4 py-1.5 rounded-full bg-gray-100/80 dark:bg-gray-800/80 backdrop-blur-sm border border-gray-200/50 dark:border-gray-700/50">
                                            <span className="w-3 h-3 rounded-full mr-2" style={{ backgroundColor: getLanguageColor(repo.language) }}></span>
                                            {repo.language}
                                        </span>
                                    )}
                                    <span className="flex items-center text-yellow-600 dark:text-yellow-400">
                                        <Icons.Star filled={true} /> <span className="ml-1">{repo.stargazers_count} Estrelas</span>
                                    </span>
                                    <span className="flex items-center text-gray-500 dark:text-gray-400">
                                        <Icons.Fork /> <span className="ml-1">{repo.forks_count} Forks</span>
                                    </span>
                                    {repo.has_pages && (
                                        <span className="flex items-center text-green-600 dark:text-green-400">
                                            <span className="w-2.5 h-2.5 rounded-full bg-green-500 mr-2 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span> Online
                                        </span>
                                    )}
                                </div>

                                <div>
                                    <h3 className="text-lg font-bold mb-2">Descrição</h3>
                                    <p className="text-gray-600 dark:text-gray-300 leading-relaxed">
                                        {repo.description || "Nenhuma descrição fornecida para este repositório."}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm bg-gray-50/50 dark:bg-gray-800/30 border border-gray-100 dark:border-gray-800 p-5 rounded-2xl">
                                    <div>
                                        <span className="text-gray-500 dark:text-gray-400 block mb-1">Criado em</span>
                                        <span className="font-semibold text-gray-900 dark:text-gray-100">{formatDate(repo.created_at)}</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-500 dark:text-gray-400 block mb-1">Última atualização</span>
                                        <span className="font-semibold text-gray-900 dark:text-gray-100">{formatDate(repo.updated_at)}</span>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-4 pt-6 mt-6 border-t border-gray-100 dark:border-gray-800">
                                    <a href={repo.pageUrl} target="_blank" rel="noopener noreferrer" className="flex-1 flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white rounded-xl font-bold transition-all shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:-translate-y-0.5">
                                        <Icons.ExternalLink /> <span className="ml-2">Abrir Página do Projeto</span>
                                    </a>
                                    <a href={repo.html_url} target="_blank" rel="noopener noreferrer" className="flex-1 flex items-center justify-center px-6 py-3.5 bg-gray-100/80 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-900 dark:text-white rounded-xl font-bold transition-all border border-gray-200/50 dark:border-gray-700/50 hover:-translate-y-0.5">
                                        <Icons.Code /> <span className="ml-2">Ver Código Fonte</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Modal para adicionar um site pelo link, preenchendo os dados automaticamente
        const AddSiteModal = ({ isOpen, onClose, onAdd }) => {
            const [url, setUrl] = useState('');
            const [githubRepoUrl, setGithubRepoUrl] = useState('');
            const [metadata, setMetadata] = useState({ name: '', description: '', language: 'HTML' });
            const [loadingMetadata, setLoadingMetadata] = useState(false);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');
            const [metadataLoaded, setMetadataLoaded] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setUrl('');
                    setGithubRepoUrl('');
                    setMetadata({ name: '', description: '', language: 'HTML' });
                    setLoadingMetadata(false);
                    setSaving(false);
                    setMessage('');
                    setMetadataLoaded(false);
                }
            }, [isOpen]);

            if (!isOpen) return null;

            const fetchMetadata = async () => {
                let parsed;
                try {
                    parsed = new URL(url.trim());
                    if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('protocol');
                } catch {
                    setMessage('Digite um link válido começando com https:// ou http://.');
                    return;
                }

                setLoadingMetadata(true);
                setMessage('');
                const fallbackName = parsed.hostname.replace(/^www\./i, '');
                try {

                        return false;
                    }
                    if (!response.ok) {
                        const detail = await response.text();
                        console.error('Wen-Sites submission error:', detail);
                        alert('Não foi possível adicionar o site. Tente novamente em instantes.');
                        return false;
                    }
                    await fetchCommunitySites();
                    alert('Site adicionado à galeria compartilhada com sucesso!');
                    return true;
                } catch (err) {
                    console.error('Wen-Sites submission failed:', err);
                    alert('Falha de conexão ao adicionar o site. Tente novamente mais tarde.');
                    return false;
                }
            };

            // Derivar e processar repositorios
            const repos = useMemo(() => {
                const githubRepos = allFetchedRepos
                    // Filtro principal: Só mostrar pages, a não ser que showAllRepos seja true
                    .filter(repo => showAllRepos ? true : repo.has_pages)
                    .map(repo => {
                        let pageUrl = repo.homepage;
                        if (!pageUrl || !pageUrl.startsWith('http')) {
                            pageUrl = `https://${TARGET_USER}.github.io/${repo.name}`;
                        }
                        return { ...repo, pageUrl, isGitHubPage: !!repo.has_pages };
                    });
                    
                // Garantir que repós customizados tenham a propriedade pageUrl configurada
                const formattedCustomRepos = customRepos.map(repo => ({
                    ...repo,
                    pageUrl: repo.homepage || repo.html_url
                }));
                
                return [...githubRepos, ...formattedCustomRepos, ...communitySites];
            }, [allFetchedRepos, showAllRepos, customRepos, communitySites]);

            const languagesAvailable = useMemo(() => {
                const langs = new Set(repos.map(r => r.language).filter(Boolean));
                return Array.from(langs).sort();
            }, [repos]);

            const filteredAndSortedRepos = useMemo(() => {
                let result = repos.filter(repo => !hiddenRepos.includes(repo.id));

                if (showFavoritesOnly) {
                    result = result.filter(repo => favorites.includes(repo.id));
                }

                if (filterLang !== 'all') {
                    result = result.filter(repo => repo.language === filterLang);
                }

                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    result = result.filter(repo => 
                        repo.name.toLowerCase().includes(query) || 
                        (repo.description && repo.description.toLowerCase().includes(query)) ||
                        repo.pageUrl.toLowerCase().includes(query)
                    );
                }

                result.sort((a, b) => {
                    switch (sortBy) {
                        case 'name_asc': return a.name.localeCompare(b.name);
                        case 'name_desc': return b.name.localeCompare(a.name);
                        case 'stars': return b.stargazers_count - a.stargazers_count;
                        case 'forks': return b.forks_count - a.forks_count;
                        case 'oldest': return new Date(a.created_at) - new Date(b.created_at);
                        case 'updated': 
                        default: return new Date(b.updated_at) - new Date(a.updated_at);
                    }
                });

                return result;
            }, [repos, hiddenRepos, favorites, showFavoritesOnly, filterLang, searchQuery, sortBy]);

            // Ações extras
            const toggleFavorite = (repoId) => {
                if (favorites.includes(repoId)) {
                    setFavorites(favorites.filter(id => id !== repoId));
                } else {
                    setFavorites([...favorites, repoId]);
                }
            };

            const hideRepo = (repoId) => {
                if(!hiddenRepos.includes(repoId)){
                    setHiddenRepos([...hiddenRepos, repoId]);
                }
            };

            const handleDeleteCustomSite = (repoId) => {
                if(window.confirm("Tem certeza que deseja remover este site manual?")) {
                    setCustomRepos(customRepos.filter(r => r.id !== repoId));
                    setFavorites(favorites.filter(id => id !== repoId)); 
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        if(!Array.isArray(json)) throw new Error("O JSON deve ser uma lista (array).");
                        
                        const newRepos = json.map(item => ({
                            id: `custom-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                            name: item.name || 'Site Sem Nome',
                            full_name: `manual/${item.name || 'Site'}`,
                            homepage: item.url,
                            html_url: item.url,
                            description: item.description || '',
                            language: item.language || 'HTML',
                            stargazers_count: item.stars || 0,
                            forks_count: 0,
                            has_pages: true,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            isCustom: true
                        }));
                        
                        setCustomRepos(prev => [...prev, ...newRepos]);
                        alert(`${newRepos.length} sites importados com sucesso!`);
                    } catch (err) {
                        alert('Erro ao ler o arquivo JSON. Certifique-se de que o formato está correto.');
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // Reset input
            };

            const handleAddManualSite = (data) => {
                const newRepo = {
                    id: `custom-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    name: data.name,
                    full_name: `manual/${data.name}`,
                    homepage: data.url,
                    html_url: data.url,
                    description: data.description,
                    language: data.language || 'HTML',
                    stargazers_count: 0,
                    forks_count: 0,
                    has_pages: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    isCustom: true
                };
                setCustomRepos(prev => [...prev, newRepo]);
            };

            const exportData = (format) => {
                if (repos.length === 0) return;
                let dataStr, mimeType, fileName;
                if (format === 'json') {
                    const exportObj = filteredAndSortedRepos.map(r => ({
                        name: r.name, url: r.pageUrl, description: r.description, 
                        language: r.language, stars: r.stargazers_count
                    }));
                    dataStr = JSON.stringify(exportObj, null, 2);
                    mimeType = 'application/json';
                    fileName = `${TARGET_USER}_ghpages.json`;
                } else if (format === 'csv') {
                    const headers = ['Nome', 'URL', 'Linguagem', 'Estrelas'];
                    const rows = filteredAndSortedRepos.map(r => `"${r.name}","${r.pageUrl}","${r.language || ''}","${r.stargazers_count}"`);
                    dataStr = [headers.join(','), ...rows].join('\n');
                    mimeType = 'text/csv';
                    fileName = `${TARGET_USER}_ghpages.csv`;
                }
                const blob = new Blob([dataStr], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', fileName);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            const gridClasses = {
                'grid': 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8',
                'compact': 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5',
                'list': 'flex flex-col space-y-5'
            };

            return (
                <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">
                    
                    {/* Header Principal */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 mt-4">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-gradient-to-br from-brand-400 to-brand-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-brand-500/40 transform hover:rotate-12 hover:scale-110 transition-all duration-300">
                                <Icons.Globe />
                            </div>
                            <h1 className="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600 dark:from-white dark:to-gray-400 tracking-tight drop-shadow-sm">
                                Wen sites
                            </h1>
                        </div>

                        <div className="flex items-center gap-3">
                            {/* Refresh Button */}
                            <button 
                                onClick={() => fetchUserRepos()} 
                                disabled={loading}
                                className="p-3.5 rounded-2xl bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50 text-gray-600 dark:text-gray-300 hover:shadow-lg dark:hover:shadow-brand-500/10 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center disabled:opacity-50"
                                title="Forçar Atualização do GitHub"
                            >
                                <Icons.Refresh className={`w-5 h-5 ${loading ? 'animate-spin' : ''}`} />
                            </button>

                            {/* Botão de Cache Buster de Imagens */}
                            <button 
                                onClick={() => setImageCacheKey(Date.now())} 
                                className="p-3.5 rounded-2xl bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50 text-gray-600 dark:text-gray-300 hover:shadow-lg dark:hover:shadow-brand-500/10 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center"
                                title="Recarregar e forçar atualização das imagens"
                            >
                                <Icons.Image />
                            </button>
                            
                            {/* Actions Group (Add Manual / Import JSON) */}
                            <div className="relative group">
                                <button className="px-4 py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-500 text-white font-semibold backdrop-blur-md border border-brand-500/50 shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:-translate-y-1 transition-all duration-300 flex items-center gap-2">
                                    <Icons.Plus /> <span className="hidden sm:inline">Adicionar Site</span>
                                </button>
                                {/* Dropdown Menu */}
                                <div className="absolute right-0 top-full mt-2 w-48 bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl rounded-xl shadow-2xl border border-gray-100/50 dark:border-gray-700/50 py-1.5 z-[100] opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 origin-top-right">
                                    <button onClick={() => setIsAddSiteModalOpen(true)} className="w-full flex items-center px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
                                        <Icons.Plus /> <span className="ml-3">Por link (automático)</span>
                                    </button>
                                    <button onClick={() => fileInputRef.current?.click()} className="w-full flex items-center px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
                                        <Icons.Upload /> <span className="ml-3">Importar JSON</span>
                                    </button>
                                </div>
                            </div>
                            
                            {/* Hidden file input for JSON */}
                            <input 
                                type="file" 
                                accept=".json" 
                                ref={fileInputRef} 
                                style={{ display: 'none' }} 
                                onChange={handleFileUpload}
                            />

                            <button onClick={toggleTheme} className="p-3.5 rounded-2xl bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50 text-gray-600 dark:text-gray-300 hover:shadow-lg dark:hover:shadow-brand-500/10 hover:-translate-y-1 transition-all duration-300">
                                {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />}
                            </button>
                        </div>
                    </header>

                    {/* Barra de Controles e Filtros */}
                    <div className="bg-white/70 dark:bg-gray-800/60 backdrop-blur-xl border border-gray-100/50 dark:border-gray-700/50 rounded-3xl p-5 mb-10 shadow-lg shadow-gray-200/20 dark:shadow-black/20 flex flex-col lg:flex-row gap-5 justify-between items-center relative z-10">
                        
                        <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                            {/* Local Search */}
                            <div className="relative flex-1 min-w-[220px]">
                                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><Icons.Search /></span>
                                <input 
                                    type="text" 
                                    placeholder="Buscar na galeria..." 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full pl-11 pr-4 py-2.5 bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur-sm border border-transparent focus:border-brand-500 rounded-xl text-sm outline-none transition-all focus:ring-4 focus:ring-brand-500/10"
                                />
                            </div>

                            {/* Sort */}
                            <select 
                                value={sortBy} 
                                onChange={e => setSortBy(e.target.value)}
                                className="bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur-sm border border-transparent px-4 py-2.5 rounded-xl text-sm font-medium outline-none focus:ring-4 focus:ring-brand-500/10 cursor-pointer transition-all"
                            >
                                <option value="updated">Mais Recentes</option>
                                <option value="oldest">Mais Antigos</option>
                                <option value="stars">Mais Estrelas</option>
                                <option value="forks">Mais Forks</option>
                                <option value="name_asc">Nome (A-Z)</option>
                                <option value="name_desc">Nome (Z-A)</option>
                            </select>

                            {/* Language Filter */}
                            <select 
                                value={filterLang} 
                                onChange={e => setFilterLang(e.target.value)}
                                className="bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur-sm border border-transparent px-4 py-2.5 rounded-xl text-sm font-medium outline-none focus:ring-4 focus:ring-brand-500/10 cursor-pointer max-w-[130px] transition-all"
                            >
                                <option value="all">Idiomas</option>
                                {languagesAvailable.map(lang => (
                                    <option key={lang} value={lang}>{lang}</option>
                                ))}
                            </select>
                            
                            {/* Mostrar Todos Toggle (NOVO) */}
                            <button 
                                onClick={() => setShowAllRepos(!showAllRepos)}
                                className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all border ${showAllRepos ? 'bg-brand-50/90 border-brand-200/50 text-brand-700 dark:bg-brand-900/30 dark:border-brand-600/50 dark:text-brand-400 shadow-inner' : 'bg-gray-100/80 dark:bg-gray-900/80 border-transparent text-gray-600 dark:text-gray-300 hover:bg-gray-200/80 dark:hover:bg-gray-800'}`}
                                title="Mostrar repositórios mesmo que não sejam GitHub Pages"
                            >
                                <Icons.Code /> <span className="ml-2 hidden sm:inline">Mostrar Tudo</span>
                            </button>

                            {/* Favorites Toggle */}
                            <button 
                                onClick={() => setShowFavoritesOnly(!showFavoritesOnly)}
                                className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all border ${showFavoritesOnly ? 'bg-yellow-50/90 border-yellow-200/50 text-yellow-700 dark:bg-yellow-900/30 dark:border-yellow-600/50 dark:text-yellow-400 shadow-inner' : 'bg-gray-100/80 dark:bg-gray-900/80 border-transparent text-gray-600 dark:text-gray-300 hover:bg-gray-200/80 dark:hover:bg-gray-800'}`}
                            >
                                <Icons.Star filled={showFavoritesOnly} /> <span className="ml-2 hidden lg:inline">Favoritos</span>
                            </button>
                        </div>

                        <div className="flex items-center gap-5 w-full lg:w-auto justify-between lg:justify-end">
                            {/* Exports */}
                            {repos.length > 0 && (
                                <div className="flex gap-2">
                                    <button onClick={() => exportData('json')} className="flex items-center text-xs font-bold text-gray-500 hover:text-brand-600 px-3 py-2 rounded-lg bg-gray-100/80 dark:bg-gray-900/80 transition-colors" title="Exportar JSON">
                                        <Icons.Download /> <span className="ml-1.5 hidden xl:inline">JSON</span>
                                    </button>
                                </div>
                            )}

                            {/* View Toggles */}
                            <div className="flex bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur-sm p-1.5 rounded-xl">
                                <button onClick={() => setViewMode('grid')} className={`p-2 rounded-lg transition-all ${viewMode === 'grid' ? 'bg-white dark:bg-gray-700 shadow-sm text-brand-600 dark:text-brand-400' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`} title="Grade Padrão">
                                    <Icons.Grid />
                                </button>
                                <button onClick={() => setViewMode('compact')} className={`p-2 rounded-lg transition-all ${viewMode === 'compact' ? 'bg-white dark:bg-gray-700 shadow-sm text-brand-600 dark:text-brand-400' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`} title="Grade Compacta">
                                    <Icons.Compact />
                                </button>
                                <button onClick={() => setViewMode('list')} className={`p-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-white dark:bg-gray-700 shadow-sm text-brand-600 dark:text-brand-400' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'}`} title="Lista">
                                    <Icons.List />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Mensagens de Erro/Empty State */}
                    {error && (
                        <div className="bg-red-50/90 dark:bg-red-900/30 text-red-600 dark:text-red-400 p-5 rounded-2xl mb-8 text-center border border-red-100 dark:border-red-800/50 font-medium backdrop-blur-sm">
                            {error}
                        </div>
                    )}

                    {!loading && repos.length === 0 && !error && (
                        <div className="text-center py-24 animate-fade-in bg-white/50 dark:bg-gray-800/30 backdrop-blur-md rounded-3xl border border-gray-100/50 dark:border-gray-700/50">
                            <div className="w-24 h-24 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-400 shadow-inner">
                                <Icons.Globe />
                            </div>
                            <h2 className="text-2xl font-bold mb-3 text-gray-900 dark:text-white">Nenhum projeto encontrado</h2>
                            <p className="text-gray-500 dark:text-gray-400 max-w-md mx-auto mb-8">
                                Não encontramos repositórios com GitHub Pages ativas para o usuário selecionado.
                            </p>
                            {!showAllRepos && (
                                <button onClick={() => setShowAllRepos(true)} className="px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg transition-all hover:-translate-y-1">
                                    Mostrar Todos os Repositórios (Comuns)
                                </button>
                            )}
                        </div>
                    )}

                    {/* Galeria de Projetos */}
                    {loading ? (
                        <div className={gridClasses[viewMode]}>
                            {[...Array(viewMode === 'compact' ? 12 : 8)].map((_, i) => (
                                <SkeletonCard key={i} viewMode={viewMode} />
                            ))}
                        </div>
                    ) : (
                        <div>
                            {filteredAndSortedRepos.length > 0 ? (
                                <div className={gridClasses[viewMode]}>
                                    {filteredAndSortedRepos.map((repo, index) => (
                                        <RepoCard 
                                            key={repo.id} 
                                            repo={repo} 
                                            viewMode={viewMode}
                                            onOpenDetails={setSelectedRepo}
                                            isFavorite={favorites.includes(repo.id)}
                                            toggleFavorite={toggleFavorite}
                                            onHide={hideRepo}
                                            index={index}
                                            onDeleteCustom={handleDeleteCustomSite}
                                            imageCacheKey={imageCacheKey}
                                        />
                                    ))}
                                </div>
                            ) : (
                                repos.length > 0 && (
                                    <div className="text-center py-24 text-gray-500 font-medium bg-white/30 dark:bg-gray-800/30 backdrop-blur-sm rounded-3xl border border-gray-100/50 dark:border-gray-700/50">
                                        Nenhum repositório corresponde aos filtros de busca/idioma atuais.
                                    </div>
                                )
                            )}
                        </div>
                    )}

                    {/* Rodapé com Status */}
                    {!loading && repos.length > 0 && (
                        <div className="mt-12 text-center text-sm font-medium text-gray-500 dark:text-gray-400 bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm py-4 rounded-2xl border border-gray-100/50 dark:border-gray-700/50 max-w-max mx-auto px-8">
                            Mostrando <span className="text-gray-900 dark:text-white font-bold">{filteredAndSortedRepos.length}</span> de <span className="text-gray-900 dark:text-white font-bold">{repos.length}</span> projetos detectados.
                            {hiddenRepos.length > 0 && (
                                <button onClick={() => setHiddenRepos([])} className="ml-3 text-brand-600 hover:text-brand-500 dark:text-brand-400 dark:hover:text-brand-300 hover:underline transition-all">
                                    Restaurar {hiddenRepos.length} ocultos.
                                </button>
                            )}
                        </div>
                    )}

                    {/* Componente Modal */}
                    {selectedRepo && (
                        <DetailsModal 
                            repo={selectedRepo} 
                            onClose={() => setSelectedRepo(null)} 
                            imageCacheKey={imageCacheKey}
                        />
                    )}

                    {/* Modal Add Site Manual */}
                    <AddSiteModal 
                        isOpen={isAddSiteModalOpen} 
                        onClose={() => setIsAddSiteModalOpen(false)} 
                        onAdd={handleSubmitCommunitySite} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
